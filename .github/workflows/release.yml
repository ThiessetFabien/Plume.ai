name: "🚀 Release Gate — Validation & Merge vers main"

# Se déclenche uniquement sur les PR ciblant main
on:
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Gate — Validation du numéro de version
  # Ce job BLOQUE le merge si la version n'est pas
  # un semver valide ET supérieure à la version actuelle sur main.
  # ─────────────────────────────────────────────
  validate-version:
    name: "🔖 Gate — Validation Semver"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout complet (avec historique pour les tags)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Installation de packaging pour comparaison semver"
        run: pip install packaging

      - name: "🔍 Extraction et validation de la version"
        id: version_check
        run: |
          # Extraire la version depuis backend/main.py
          PR_VERSION=$(python3 -c "
          import re
          with open('backend/main.py') as f:
              content = f.read()
          match = re.search(r'version=\"(\d+\.\d+\.\d+)\"', content)
          if not match:
              print('ERROR: Aucun numéro de version semver trouvé dans backend/main.py')
              exit(1)
          print(match.group(1))
          ")
          
          echo "📦 Version dans la PR : $PR_VERSION"
          echo "pr_version=$PR_VERSION" >> $GITHUB_OUTPUT

      - name: "📋 Récupération de la version actuelle sur main"
        id: main_version
        run: |
          # Récupérer la version sur la branche main (pas la PR)
          git fetch origin main
          MAIN_VERSION=$(git show origin/main:backend/main.py 2>/dev/null | python3 -c "
          import re, sys
          content = sys.stdin.read()
          match = re.search(r'version=\"(\d+\.\d+\.\d+)\"', content)
          # Si main n'a pas encore de version ou de fichier, on part de 0.0.0
          print(match.group(1) if match else '0.0.0')
          ")
          
          echo "🏷️  Version actuelle sur main : $MAIN_VERSION"
          echo "main_version=$MAIN_VERSION" >> $GITHUB_OUTPUT

      - name: "✅ Comparaison des versions (doit être supérieure)"
        env:
          PR_VERSION: ${{ steps.version_check.outputs.pr_version }}
          MAIN_VERSION: ${{ steps.main_version.outputs.main_version }}
        run: |
          echo "🔎 Comparaison des versions :"
          echo "   → PR (dev) : $PR_VERSION"
          echo "   → Main     : $MAIN_VERSION"
          
          python3 -c "
          import sys, os
          from packaging.version import Version
          pr = os.getenv('PR_VERSION')
          main = os.getenv('MAIN_VERSION')
          
          if not pr or not main:
              print('❌ ERREUR : Impossible de récupérer les numéros de version.')
              sys.exit(1)
              
          v_pr = Version(pr)
          v_main = Version(main)
          
          if v_pr <= v_main:
              print(f'\n❌ ÉCHEC : La version {v_pr} n\'est pas supérieure à la version actuelle {v_main}.')
              print('   → Action : Augmentez le numéro de version dans backend/main.py (ex: 1.1.0).')
              sys.exit(1)
          
          print(f'\n✅ Version validée : {v_pr} > {v_main}')
          "



  # ─────────────────────────────────────────────
  # Job 2 : CI Final — Tests complets avant prod
  # Dépend de validate-version (bloqué si la version est invalide)
  # ─────────────────────────────────────────────
  final-ci-backend:
    name: "🐍 Final CI — Pytest (prod gate)"
    runs-on: ubuntu-latest
    needs: validate-version   # ← Bloqué si validate-version échoue

    defaults:
      run:
        working-directory: backend

    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: "📦 Installation des dépendances"
        run: pip install -r requirements.txt

      - name: "🧪 Tests Pytest (validation finale avant main)"
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_HOST: localhost
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PLUME_ENCRYPTION_KEY: ${{ secrets.PLUME_ENCRYPTION_KEY }}
          TRUSTED_ORIGINS: "http://localhost:3000"
          GROQ_API_KEY: "ci-placeholder-key"
          DATABASE_URL: "sqlite:///./test.db"
        run: pytest tests/ -v --tb=short

  final-ci-frontend:
    name: "📱 Final CI — Jest (prod gate)"
    runs-on: ubuntu-latest
    needs: validate-version   # ← Bloqué si validate-version échoue

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: "📦 Installation des dépendances npm"
        run: npm ci --legacy-peer-deps

      - name: "🧪 Tests Jest (validation finale avant main)"
        run: npm test -- --watchAll=false --passWithNoTests
