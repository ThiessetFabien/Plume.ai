name: Plume.ai CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Pipeline d'attente (Template)
      run: |
        echo "Le pipeline CI/CD est initialisé."
        echo "Les tests Flake8/Pytest s'exécuteront ici lors de la complétion du backend."
