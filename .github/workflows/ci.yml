name: "🧪 CI — Tests & Qualité (dev)"

# Se déclenche sur toute PR vers dev et sur les pushs directs sur dev
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Tests Backend (Pytest + SQLite)
  # ─────────────────────────────────────────────
  backend-tests:
    name: "🐍 Backend — Pytest"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: "📦 Installation des dépendances"
        run: pip install -r requirements.txt

      - name: "🧪 Exécution des tests Pytest"
        env:
          # Variables d'environnement mockées pour le CI (SQLite en mémoire, pas de Postgres)
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_HOST: localhost
          JWT_SECRET_KEY: "ci-test-jwt-secret-key-not-for-production"
          PLUME_ENCRYPTION_KEY: "wbkCcEKaJVDOq6s5Y5i9Ydu-y7v-BVAjq_eSvBcVPco="
          TRUSTED_ORIGINS: "http://localhost:3000"
          GROQ_API_KEY: "ci-placeholder-key"
          DATABASE_URL: "sqlite:///./test.db"
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Job 2 : Tests Frontend (Jest)
  # ─────────────────────────────────────────────
  frontend-tests:
    name: "📱 Frontend — Jest"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: "📦 Installation des dépendances npm"
        run: npm ci --legacy-peer-deps

      - name: "🧪 Exécution des tests Jest"
        run: npm test -- --watchAll=false --passWithNoTests
